<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Jilomb Miker Product Evidence</title>
  <desc id="desc">Warm editorial profile banner with an evidence dashboard for an AI product indie builder</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#17191c" stroke-opacity=".055"/></pattern>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf7"/><stop offset="1" stop-color="#eee8da"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#5d2a1a" flood-opacity=".12"/></filter>
    <clipPath id="headlineClip"><rect x="74" y="126" width="650" height="132" rx="4"/></clipPath>
  </defs>
  <style>
    .sans{font-family:"Avenir Next","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}.serif{font-family:Georgia,"Noto Serif SC","Songti SC",STSong,serif}.mono{font-family:"SFMono-Regular","JetBrains Mono",Menlo,Consolas,monospace}.ink{fill:#17191c}.muted{fill:#6d6a62}.red{fill:#9a4936}.blue{fill:#1478b8}
    .enter{opacity:0;transform:translateY(8px);animation:enter 7.2s cubic-bezier(.16,1,.3,1) infinite}.e1{animation-delay:.1s}.e2{animation-delay:.34s}.e3{animation-delay:.58s}.e4{animation-delay:.82s}.headline{opacity:0;transform:translateY(115px);animation:headline 7.2s cubic-bezier(.16,1,.3,1) infinite}.pulse{transform-origin:center;animation:pulse 2.1s ease-in-out infinite}.arrow{animation:nudge 1.4s ease-in-out infinite}
    @keyframes enter{0%,5%{opacity:0;transform:translateY(8px)}11%,82%{opacity:1;transform:none}92%,100%{opacity:0;transform:translateY(-3px)}}@keyframes headline{0%,8%{opacity:0;transform:translateY(115px)}17%,84%{opacity:1;transform:none}92%,100%{opacity:0;transform:translateY(-12px)}}@keyframes pulse{0%,100%{opacity:.35;transform:scale(.86)}50%{opacity:1;transform:scale(1.08)}}@keyframes nudge{0%,100%{transform:none}50%{transform:translateX(7px)}}
    @media(prefers-reduced-motion:reduce){.enter,.headline,.pulse,.arrow{animation:none;opacity:1;transform:none}}
  </style>
  <rect x="8" y="8" width="1184" height="544" rx="22" fill="#17191c"/>
  <rect x="1" y="1" width="1184" height="544" rx="22" fill="url(#paper)" stroke="#17191c" stroke-width="2"/>
  <rect x="1" y="1" width="1184" height="544" rx="22" fill="url(#grid)"/>
  <path d="M1 68H1185" stroke="#17191c" stroke-width="2"/>
  <rect x="24" y="23" width="82" height="28" rx="14" fill="#17191c"/><text x="65" y="42" class="mono" fill="#fffdf7" font-size="12" font-weight="700" text-anchor="middle">JILOMB</text>
  <text x="124" y="42" class="mono ink" font-size="13" font-weight="700" letter-spacing="1.5">AI PRODUCT PRACTICE</text>
  <text x="1154" y="42" class="mono muted" font-size="12" text-anchor="end">BUILD SIGNAL</text><circle cx="1170" cy="37" r="5" class="blue pulse"/>

  <text x="74" y="110" class="mono red enter e1" font-size="14" font-weight="700" letter-spacing="1.5">AI PRODUCT INDIE BUILDER · AGENTS · EVAL · SHIPPING</text>
  <g clip-path="url(#headlineClip)"><g class="headline"><text x="72" y="188" class="serif ink" font-size="62" font-weight="700">把真实问题做成</text><text x="72" y="246" class="serif ink" font-size="62" font-weight="700">可验证的 AI 产品<tspan class="red">。</tspan></text></g></g>
  <text x="75" y="288" class="sans muted enter e2" font-size="19">从问题定义、产品实现到评测与公开审阅。</text>
  <text x="75" y="320" class="sans muted enter e3" font-size="19">让每一个判断，都留下别人可以检查的证据。</text>

  <rect x="760" y="112" width="354" height="234" rx="18" fill="#fffdf7" stroke="#d8d2c5" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="784" y="132" width="54" height="24" rx="7" fill="#17191c"/><text x="811" y="149" class="mono" fill="#fffdf7" font-size="9" font-weight="700" text-anchor="middle">JILOMB</text>
  <text x="854" y="149" class="mono ink" font-size="11" font-weight="700">PRODUCT EVIDENCE</text><circle cx="1056" cy="144" r="4" class="blue pulse"/><text x="1090" y="148" class="mono blue" font-size="10" text-anchor="end">LIVE</text>
  <path d="M760 160H1114" stroke="#17191c" stroke-opacity=".14"/>
  <text x="786" y="194" class="mono muted enter e1" font-size="11">ROLE</text><text x="874" y="194" class="sans ink enter e1" font-size="14" font-weight="700">AI Product Indie Builder</text><path d="M786 210H1090" stroke="#17191c" stroke-opacity=".1"/>
  <text x="786" y="236" class="mono muted enter e2" font-size="11">FOCUS</text><text x="874" y="236" class="sans ink enter e2" font-size="14" font-weight="700">Agent · Product · Eval</text><path d="M786 252H1090" stroke="#17191c" stroke-opacity=".1"/>
  <text x="786" y="278" class="mono muted enter e3" font-size="11">METHOD</text><text x="874" y="278" class="sans ink enter e3" font-size="14" font-weight="700">Problem → Product → Proof</text>
  <rect x="786" y="310" width="70" height="7" rx="3.5" fill="#3ba6f1"/><rect x="864" y="310" width="70" height="7" rx="3.5" fill="#3ba6f1"/><rect x="942" y="310" width="70" height="7" rx="3.5" fill="#3ba6f1"/><rect x="1020" y="310" width="70" height="7" rx="3.5" fill="#c1e1f7"/>

  <path d="M74 374H1114" stroke="#17191c" stroke-opacity=".22"/><text x="74" y="402" class="mono muted" font-size="12" letter-spacing="1.6">SELECTED WORK // PUBLIC PROOF</text>
  <g class="enter e1"><rect x="74" y="420" width="320" height="92" rx="14" fill="#fffdf7" stroke="#d8d2c5"/><text x="94" y="446" class="mono blue" font-size="10" font-weight="700">AI INTERACTIVE PRODUCT</text><text x="94" y="474" class="serif ink" font-size="22" font-weight="700">人生岔路</text><text x="94" y="496" class="sans muted" font-size="12">LIVE PRODUCT · TEST REPORT</text></g>
  <g class="enter e2"><rect x="414" y="420" width="320" height="92" rx="14" fill="#fffdf7" stroke="#d8d2c5"/><text x="434" y="446" class="mono blue" font-size="10" font-weight="700">PRODUCT DECISION SKILLS</text><text x="434" y="474" class="serif ink" font-size="22" font-weight="700">work-skill</text><text x="434" y="496" class="sans muted" font-size="12">PUBLIC SKILLS · SELF-TESTED</text></g>
  <g class="enter e3"><rect x="754" y="420" width="360" height="92" rx="14" fill="#fbe1d1" stroke="#d8b8a4"/><text x="774" y="446" class="mono red" font-size="10" font-weight="700">REAL-WORLD AGENTS</text><text x="774" y="474" class="serif ink" font-size="22" font-weight="700">entertainment-skill</text><text x="774" y="496" class="sans muted" font-size="12">STATE · MULTIMODAL · SAFETY</text></g>
  <text x="1114" y="538" class="mono red" font-size="12" font-weight="700" text-anchor="end">VIEW PUBLIC WORK</text><text x="1125" y="538" class="mono red arrow" font-size="16">→</text>
</svg>
